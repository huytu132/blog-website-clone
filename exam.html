<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Thi trắc nghiệm 40 câu</title>
    <link rel="stylesheet" href="./css/exam.css">
</head>

<body>
    <div id="header">
        <button class="btn btn-main"><a href="index.html">🏠 Trang chủ</a></button>
        <button id="menuToggle" class="btn btn-blue">☰</button>
        <div id="exam-timer">60:00</div>
    </div>

    <div id="quiz"></div>

    <div id="sidebar">
        <h3>Danh sách câu</h3>
        <div id="questionNav"></div>
        <button class="btn btn-main" onclick="submitExam()">Nộp bài</button>
    </div>

    <div id="overlay"></div>

    <div id="resultModal" class="modal hidden">
        <div class="modal-content">
            <h2>Kết quả</h2>
            <p id="resultText"></p>
            <button class="btn btn-blue" onclick="closeModal()">Đóng</button>
        </div>
    </div>

    <script src="./scripts/exam.js"></script>
</body>

</html>
