<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thi trắc nghiệm</title>
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./css/exam.css">
    <script src="./scripts/theme.js"></script>
</head>

<body>
    <!-- ─── Fixed Header ─────────────────────────── -->
    <div id="header">
        <a href="index.html" class="btn btn-ghost">← Trang chủ</a>
        <div id="exam-info">
            <span id="exam-title-label"></span>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button class="theme-toggle btn-icon-header" onclick="toggleTheme()" style="display:flex; width: 34px; height: 34px; padding: 0;">☀️</button>
            <div id="exam-timer">60:00</div>
        </div>
    </div>

    <!-- ─── Fixed Progress Bar ───────────────────── -->
    <div id="progress-wrap">
        <div id="progress-track">
            <div id="progress-bar-fill"></div>
        </div>
        <span id="progress-text">0 / 0</span>
    </div>

    <!-- ─── Main layout ──────────────────────────── -->
    <div id="main-layout">

        <!-- Scrollable quiz area -->
        <div id="quiz"></div>

        <!-- Fixed sidebar -->
        <aside id="sidebar">
            <div id="sidebar-header">
                <span>Câu hỏi</span>
                <button id="menuToggle" class="btn-icon" aria-label="Đóng menu">✕</button>
            </div>
            <div id="questionNav"></div>
            <div id="sidebar-footer">
                <button class="btn btn-submit" onclick="submitExam()">Nộp bài</button>
            </div>
        </aside>
    </div>

    <!-- Overlay (mobile) -->
    <div id="overlay"></div>

    <!-- Floating open sidebar button (mobile) -->
    <button id="fab-sidebar" onclick="openSidebar()" aria-label="Danh sách câu">☰</button>

    <!-- ─── Modal: Kết quả ────────────────────────── -->
    <div id="resultModal" class="modal" role="dialog" aria-modal="true">
        <div class="modal-card">
            <div class="modal-icon" id="resultIcon">✅</div>
            <h2 id="resultGrade"></h2>
            <div class="result-score-big" id="resultScore"></div>
            <p id="resultPct"></p>
            <div id="resultActions"></div>
        </div>
    </div>

    <!-- ─── Modal: Câu sai ───────────────────────── -->
    <div id="wrongModal" class="modal" role="dialog" aria-modal="true">
        <div class="modal-card modal-wide">
            <h2>📋 Các câu trả lời sai</h2>
            <div id="wrongList"></div>
            <button class="btn btn-ghost-dark" onclick="closeWrongModal()" style="margin-top:16px">✕ Đóng</button>
        </div>
    </div>

    <script src="./scripts/exam.js"></script>
</body>

</html>
